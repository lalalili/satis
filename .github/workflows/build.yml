name: Build & Deploy Satis

on:
  push:
    branches: [main]
    paths:
      - 'satis.json'
      - '.github/workflows/build.yml'
  repository_dispatch:
    types: [package-released]
  # 排程與手動觸發保留為自動發版串接失敗時的復原路徑。
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 排程與手動觸發可能重疊,同時只跑一個
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate release payload
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_PACKAGE: ${{ github.event.client_payload.package }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          php -r '
          $package = getenv("RELEASE_PACKAGE");
          $version = getenv("RELEASE_VERSION");
          $sha = getenv("RELEASE_SHA");

          if (! preg_match("#^lalalili/[a-z0-9._-]+$#", $package)) {
              fwrite(STDERR, "ERROR: invalid package payload\n");
              exit(1);
          }

          if (! preg_match("/^v[0-9]+\.[0-9]+\.[0-9]+$/", $version)) {
              fwrite(STDERR, "ERROR: invalid version payload\n");
              exit(1);
          }

          if (! preg_match("/^[0-9a-f]{40}$/", $sha)) {
              fwrite(STDERR, "ERROR: invalid SHA payload\n");
              exit(1);
          }

          $config = json_decode(file_get_contents("satis.json"), true, flags: JSON_THROW_ON_ERROR);
          $repositories = array_column($config["repositories"] ?? [], "url");
          $expectedUrl = "https://github.com/{$package}.git";

          if (! in_array($expectedUrl, $repositories, true)) {
              fwrite(STDERR, "ERROR: package is not configured in satis.json\n");
              exit(1);
          }
          '

      - name: Install Satis
        run: |
          composer create-project composer/satis /tmp/satis \
            --stability=dev --no-interaction --no-progress

      # marketing-automation 是私有 repo，必須使用只讀 fine-grained PAT。
      - name: Build index
        env:
          SATIS_GITHUB_TOKEN: ${{ secrets.SATIS_GITHUB_TOKEN }}
          COMPOSER_PROCESS_TIMEOUT: '0'
        run: |
          test -n "$SATIS_GITHUB_TOKEN" || {
            echo "ERROR: SATIS_GITHUB_TOKEN is required"
            exit 1
          }
          composer config --global --auth github-oauth.github.com "$SATIS_GITHUB_TOKEN"
          php /tmp/satis/bin/satis build satis.json public

      - name: Verify required package metadata
        run: |
          php -r '
          $requirements = [
              "lalalili/marketing-automation" => "v3.0.1",
              "lalalili/report-queue" => "v1.0.1",
              "lalalili/survey-core" => "v1.1.1",
              "lalalili/survey-filament" => "v1.1.1",
          ];

          foreach ($requirements as $package => $version) {
              $path = "public/p2/{$package}.json";

              if (! is_file($path)) {
                  fwrite(STDERR, "ERROR: missing {$path}\n");
                  exit(1);
              }

              $metadata = json_decode(file_get_contents($path), true, flags: JSON_THROW_ON_ERROR);
              $versions = array_column($metadata["packages"][$package] ?? [], "version");

              if (! in_array($version, $versions, true)) {
                  fwrite(STDERR, "ERROR: {$package} {$version} is missing\n");
                  exit(1);
              }
          }
          '

      - name: Verify released package metadata
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_PACKAGE: ${{ github.event.client_payload.package }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          php -r '
          $package = getenv("RELEASE_PACKAGE");
          $version = getenv("RELEASE_VERSION");
          $sha = getenv("RELEASE_SHA");
          $path = "public/p2/{$package}.json";

          if (! is_file($path)) {
              fwrite(STDERR, "ERROR: missing {$path}\n");
              exit(1);
          }

          $metadata = json_decode(file_get_contents($path), true, flags: JSON_THROW_ON_ERROR);
          $versions = $metadata["packages"][$package] ?? [];

          foreach ($versions as $candidate) {
              if (($candidate["version"] ?? null) !== $version) {
                  continue;
              }

              $sourceReference = $candidate["source"]["reference"] ?? null;
              $distReference = $candidate["dist"]["reference"] ?? null;

              if ($sourceReference === $sha && $distReference === $sha) {
                  exit(0);
              }

              fwrite(STDERR, "ERROR: {$package} {$version} reference mismatch\n");
              exit(1);
          }

          fwrite(STDERR, "ERROR: {$package} {$version} is missing\n");
          exit(1);
          '

      - name: Show index size
        run: du -sh public && ls public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # public repo 60 天無活動會被 GitHub 停用整個 workflow（含 dispatch）。
  # 排程執行時對自己重新 enable，可重置計時；與建置分開，建置失敗也照做。
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yml --repo "$GITHUB_REPOSITORY"
